name: Deploy design previews
on:
  push:
    branches: [design-preview]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: design-preview-pages
  cancel-in-progress: true
jobs:
  build:
    if: github.ref == 'refs/heads/design-preview'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:preview
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
