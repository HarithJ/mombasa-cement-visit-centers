log_format visit_nyumba '$remote_addr - $remote_user [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent';

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name jayram.org;
    server_tokens off;
    root /srv/visit-nyumba/current/public;
    index index.php;
    ssl_certificate /etc/letsencrypt/live/jayram.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jayram.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    access_log /var/log/nginx/visit-nyumba-access.log visit_nyumba;
    # Avoid writing private feedback query tokens into error logs.
    error_log /var/log/nginx/visit-nyumba-error.log crit;
    client_max_body_size 1m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    location ~ ^/v[123]/feedback$ { return 308 /feedback$is_args$args; }
    location ~ ^/v[123](?:/|/index\.php)?$ { return 308 /$is_args$args; }
    location / { try_files $uri $uri/ /index.php?$query_string; }
    location ~ ^/(?:v[123]/)?index\.php$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param HTTPS on;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }
    location ~ \.php$ { return 404; }
    location ~ /\. { deny all; }
}

server {
    listen 80;
    listen [::]:80;
    server_name jayram.org;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / { return 301 https://jayram.org$request_uri; }
}
